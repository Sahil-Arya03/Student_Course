# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# PostgreSQL Datasource
# ==============================
# Create the database first: CREATE DATABASE course_management_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/course_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
# update = auto-creates/updates tables based on entities (fine for learning; use migrations like Flyway in real projects)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# Jackson (JSON)
# ==============================
spring.jackson.default-property-inclusion=non_null
